# Helm values for the Abu Dhabi Submariner operator release.
#
# This is the source of truth for the Abu Dhabi side. The live Helm values only
# carried the broker/operator/submariner basics; globalCidr and ipsec.psk were
# applied to the CR out-of-band and were missing here, so a future
# `helm upgrade -f` would have dropped them (no matching PSK -> tunnel down; no
# globalCIDR -> globalnet cannot allocate ClusterSetIPs). This file restores
# parity so `helm upgrade` reproduces the live CR for every field the chart can
# manage.
#
# The chart CANNOT set airGappedDeployment, nodeSelector or tolerations: the
# Submariner CR template (submariner-operator/templates/submariner.yaml) has no
# such fields, so those live only on the CR and are applied by
# submariner-cr-overlay.yaml, not by this file.
#
# Apply:
#   helm upgrade submariner-operator submariner-operator-0.24.0.tgz \
#     -n submariner-operator --reuse-values -f submariner-values-abudhabi.yaml
#
# Cluster credentials (broker CA/token, IPsec PSK) are embedded here because this
# is a private interconnect runbook directory and the guides already carry them;
# see CLAUDE.md for the exception that allows cluster credentials in this tree.
