# Helm values for the Al Ain Submariner operator release.
#
# This is the source of truth for the Al Ain side. `helm upgrade` with these
# values reproduces the live Submariner CR for every field the operator chart can
# manage, including broker.insecure (-> CR brokerK8sInsecure), which the runbook
# previously patched in out-of-band. Without it a `helm upgrade -f` that omits it
# would revert the gateway to TLS-strict mode and break the tunnel to the broker.
#
# The chart CANNOT set airGappedDeployment, nodeSelector or tolerations: the
# Submariner CR template (submariner-operator/templates/submariner.yaml) has no
# such fields, so those three live only on the CR and are applied by
# submariner-cr-overlay.yaml, not by this file.
#
# Apply:
#   helm upgrade submariner-operator submariner-operator-0.24.0.tgz \
#     -n submariner-operator --reuse-values -f submariner-values-alain.yaml
#
# Cluster credentials (broker CA/token, IPsec PSK) are embedded here because this
# is a private interconnect runbook directory and the guides already carry them;
# see CLAUDE.md for the exception that allows cluster credentials in this tree.
