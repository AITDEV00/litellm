syntax = "proto3";

// Package mcp.sourcebroker.dispatch.v1 is the wire contract between the MCP
// broker sidecar and the source connector. The connector dials home and
// serves this service over a grpctunnel reverse tunnel; the sidecar pushes
// every RPC.
//
// Evolution rules, binding for every change to this file:
//   - additive only: add fields and add RPCs; never renumber, repurpose, or
//     remove an existing tag, field, or method;
//   - a connector that does not implement an RPC answers Unimplemented and
//     the broker degrades to the remaining capability set;
//   - breaking changes require a deliberate new connector release, never a
//     silent one.
//
// Connector identity (member, generation, credential) is not part of this
// file: it travels as metadata on the tunnel-opening stream and is validated
// by the sidecar before the tunnel establishes.
package mcp.sourcebroker.dispatch.v1;

option go_package = "oicm-litellm-layer/mcp-source-link/dispatchpb";

// DispatchService is implemented by the connector; the sidecar is the client.
service DispatchService {
  // Admit is the first RPC pushed down a newly opened tunnel. The connector
  // answers with its capability set; the broker gates every other RPC on
  // that answer.
  rpc Admit(AdmitRequest) returns (AdmitResponse);

  // Probe fetches the origin's signed catalog proof. The signature covers
  // the fresh nonce, so responses cannot be replayed across probes.
  rpc Probe(ProbeRequest) returns (ProbeResponse);

  // Execute performs one HTTP round trip against the connector's loopback
  // origin. The per-RPC deadline and cancellation ride the gRPC context.
  rpc Execute(DispatchRequest) returns (DispatchResponse);
}

message AdmitRequest {
  // Capability names this broker sidecar may push. A connector that does
  // not recognize a name ignores it. Names are stable identifiers: new
  // capabilities append and existing names never change meaning.
  repeated string broker_capabilities = 1;
}

message AdmitResponse {
  // Capability names this connector implements. The broker dispatches an RPC
  // only when its name appears here. Names are stable identifiers: new
  // capabilities append and existing names never change meaning.
  repeated string capabilities = 1;
}

message ProbeRequest {
  // Fresh nonce generated by the sidecar for this probe.
  string nonce = 1;
}

message ProbeResponse {
  // Raw origin catalog bytes served for this probe. The sidecar canonicalizes
  // them and verifies the proof signature against the resulting digest, so a
  // relayed digest can never be substituted for the bytes actually carried.
  bytes catalog_json = 1;
  // Ed25519 signature from the origin's X-Source-Signature response header,
  // covering the nonce, the source ID, the dataset ID, and the catalog digest.
  bytes proof_signature = 2;
}

message DispatchRequest {
  // HTTP method, uppercase, e.g. "GET" or "POST".
  string method = 1;
  // Origin request path, always starting with "/".
  string path = 2;
  // Raw URL query without the leading "?".
  string query = 3;
  // Request headers after the broker's credential-stripping allowlist.
  repeated Header headers = 4;
  // Request body; oversize bodies fail the RPC with ResourceExhausted.
  bytes body = 5;
}

message DispatchResponse {
  // Origin HTTP status code.
  int32 status = 1;
  // Origin response headers.
  repeated Header headers = 2;
  // Origin response body; oversize bodies fail the RPC with ResourceExhausted.
  bytes body = 3;
}

message Header {
  string name = 1;
  string value = 2;
}
