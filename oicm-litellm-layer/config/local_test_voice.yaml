model_list:
  - model_name: omnivoice
    litellm_params:
      model: omnivoice/omnivoice
      api_base: http://localhost:18080
      mode: audio_speech

litellm_settings:
  store_model_in_db: false
  drop_params: true
  cache: false

router_settings:
  routing_strategy: usage-based-routing-v2
  optional_pre_call_checks:
    - enforce_model_rate_limits

general_settings:
  # Derived from the single source of truth: the `litellm-master-key` Secret in
  # deploy/prod/litellm-proxy.yaml. Export LITELLM_MASTER_KEY (e.g. via
  # `make` which sets it from scripts/get_master_key.py) before running locally.
  master_key: os.environ/LITELLM_MASTER_KEY
