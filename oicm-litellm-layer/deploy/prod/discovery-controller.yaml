---
# OICM Discovery Controller Deployment
#
# Pinned to adeo-gpu-03 (the Submariner gateway node) for the same reason as litellm-proxy:
# the controller queries Submariner-imported model endpoints at globalnet IPs (242.0.0.x),
# which are only reachable from the gateway node due to Cilium's BPF kube-proxy replacement
# dropping return traffic for non-gateway pods. See the Al Ain Submariner guide §12.1.
#
# Commands used to apply this configuration:
#
#   # Pin to gpu-03 with tolerations for all three GPU node taints:
#   kubectl patch deploy oicm-discovery-controller -n adeo-litellm --type=json -p='[
#     {"op":"add","path":"/spec/template/spec/nodeSelector","value":{"kubernetes.io/hostname":"adeo-gpu-03"}},
#     {"op":"add","path":"/spec/template/spec/tolerations","value":[
#       {"key":"tenant","value":"adeo","effect":"NoSchedule"},
#       {"key":"tenant","value":"adeo","effect":"NoExecute"},
#       {"key":"target","value":"k8s","effect":"NoSchedule"},
#       {"key":"target","value":"k8s","effect":"NoExecute"},
#       {"key":"nvidia.com/gpu","effect":"NoSchedule"}
#     ]}
#   ]'
#
#   # Add ENABLE_SUBMARINER_IMPORTS env var (was missing from the initially deployed version):
#   kubectl patch deploy oicm-discovery-controller -n adeo-litellm --type=json -p='[
#     {"op":"add","path":"/spec/template/spec/containers/0/env/-","value":{"name":"ENABLE_SUBMARINER_IMPORTS","value":"true"}}
#   ]'
#
#   # Apply the updated RBAC (the deployed Role was missing the endpointslices rule needed
#   # by the SubmarinerImportSource to list EndpointSlices created by the lighthouse agent):
#   kubectl apply -f deploy/discovery-controller.yaml
#
#   # Build and push the controller image (requires Harbor access, run from oicm-litellm-layer/):
#   make login && make build && make push-discovery
#
#   # Restart to pull the new image:
#   kubectl -n adeo-litellm rollout restart deploy/oicm-discovery-controller
#
# The Role in this manifest includes endpointslices permissions (discovery.k8s.io API group)
# which the SubmarinerImportSource needs to list cross-cluster EndpointSlices created by the
# lighthouse agent. Without this, the controller gets 403 Forbidden when trying to discover
# Submariner-imported services.
#
# The gpu-03 node has three taints (tenant=adeo, target=k8s, nvidia.com/gpu) so tolerations
# for all three are required.

---
# Deployment manifest for the OICM Discovery Controller
# This runs as a separate Deployment in the mlops namespace,
# watching the adeo namespace for model deployments.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oicm-discovery-controller
  namespace: adeo-litellm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oicm-discovery-controller
  namespace: adeo
rules:
  # Read deployments (to discover model deployments)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  # Read services (to get ClusterIP for health checks)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  # Read configmaps (to get MODEL_ID)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  # Read endpointslices (to discover Submariner-imported services)
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oicm-discovery-controller
  namespace: adeo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oicm-discovery-controller
subjects:
  - kind: ServiceAccount
    name: oicm-discovery-controller
    namespace: adeo-litellm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oicm-discovery-controller
  namespace: adeo-litellm
  labels:
    app: oicm-discovery-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oicm-discovery-controller
  template:
    metadata:
      labels:
        app: oicm-discovery-controller
    spec:
      serviceAccountName: oicm-discovery-controller
      nodeSelector:
        kubernetes.io/hostname: adeo-gpu-03
      tolerations:
        - key: tenant
          value: adeo
          effect: NoSchedule
        - key: tenant
          value: adeo
          effect: NoExecute
        - key: target
          value: k8s
          effect: NoSchedule
        - key: target
          value: k8s
          effect: NoExecute
        - key: nvidia.com/gpu
          effect: NoSchedule
      containers:
        - name: controller
          image: registry.adeoaiengine.ecouncil.ae/openinnovationai/platform/mlops/mlops-serving/oicm-discovery-controller:0.1.0-20261007-920fedf
          # The version tag is immutable (semver + date + git SHA), so prod can
          # never silently change builds on a rollout or node reboot. Bump it
          # deliberately with `make controller-release`.
          imagePullPolicy: IfNotPresent
          env:
            - name: WATCH_NAMESPACE
              value: "adeo"
            # The cluster this controller runs in. Stored on every row as
            # `oicm_cluster`, which is what answers "Abu Dhabi or Al Ain" for a
            # model once a cross-cluster import shares a name with a local one.
            - name: CLUSTER_NAME
              value: "alain"
            - name: LITELLM_ADMIN_URL
              value: "http://litellm-proxy.adeo-litellm.svc.cluster.local:4000"
            - name: LITELLM_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            - name: CLUSTER_DOMAIN
              value: "svc.cluster.local"
            - name: MODEL_PORT
              value: "8080"
            - name: SYNC_INTERVAL
              value: "300"
            - name: ENABLE_SUBMARINER_IMPORTS
              value: "true"
            # OICM status sources. Which instances exist (endpoints, realm,
            # workspace) is declared in the oicm-sources ConfigMap, mounted at
            # /etc/oicm. Credentials are NOT in the ConfigMap: a ConfigMap cannot
            # hold or interpolate a Secret value, so each source's credentials
            # are wired here from its own Secret, under variable names derived
            # from the source name in sources.yaml.
            #
            # Both OICMs are read at once. Al Ain is in-cluster; Abu Dhabi is
            # reached over Submariner, and its clusterset.local names resolve
            # only from pods on the Al Ain gateway node adeo-gpu-03, which is
            # what this manifest already pins to.
            #
            # One deployment_summary call per source per STATUS_SYNC_INTERVAL
            # covers every deployment; OICM refreshes status on a ~5s DB sync
            # plus a ~10s informer reload, so 10s matches the source's cadence.
            #
            # Keep this in step with sources.yaml: a source listed there whose
            # credentials are absent here is skipped with a warning.
            - name: OICM_SOURCES_FILE
              value: "/etc/oicm/sources.yaml"
            - name: OICM_SOURCE_ALAIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oicm-status-api
                  key: username
            - name: OICM_SOURCE_ALAIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oicm-status-api
                  key: password
            - name: OICM_SOURCE_ABUDHABI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ad-oicm-status-api
                  key: username
            - name: OICM_SOURCE_ABUDHABI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ad-oicm-status-api
                  key: password
            - name: STATUS_SYNC_INTERVAL
              value: "10"
            # How long a source's last successful poll may be old before its
            # status is reported unknown rather than trusted. The heartbeat
            # write cadence is derived from this as STATUS_STALE_AFTER / 3.
            - name: STATUS_STALE_AFTER
              value: "90"
          volumeMounts:
            - name: oicm-sources
              mountPath: /etc/oicm
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: oicm-sources
          configMap:
            name: oicm-sources
