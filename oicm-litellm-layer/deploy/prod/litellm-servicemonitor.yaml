---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm-proxy-service-monitor
  namespace: mlops
  labels:
    release: prometheus
spec:
  endpoints:
    - interval: 30s
      path: /metrics/
      port: http
      # The proxy config requires auth on /metrics (require_auth_for_metrics_endpoint: true),
      # so the scrape presents the master key as a bearer token.
      bearerTokenSecret:
        name: litellm-master-key
        key: master-key
  namespaceSelector:
    matchNames:
      - mlops
  selector:
    matchLabels:
      app: litellm-proxy
