# Prod-only additions to the base gateway Deployment.
#
# The base already carries everything prod needs; this patch adds the values
# that only make sense here: the public install base URL, and the MCP source
# broker wiring so prod can route to the broker the way dev does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: adeo-litellm
spec:
  template:
    spec:
      containers:
        - name: litellm
          # Prod pins the exact bytes it validated. The base names only the
          # mutable `jya0-v1.108.5` tag, which dev rebuilds overwrite.
          image: registry.adeoaiengine.ecouncil.ae/openinnovationai/platform/mlops/mlops-serving/litellm-src:jya0-v1.108.5-prod@sha256:e15f122ace8e99b3d11ad5041e007acf6237978079b33baa1f7c9edbd9222e84
          env:
            - name: LITELLM_PUBLIC_BASE_URL
              value: "https://litellm.ecouncil.ae"
            # Microsoft Entra OIDC for Admin UI SSO.
            #
            # PROXY_BASE_URL is what LiteLLM uses to build the OAuth redirect
            # URI: it appends /sso/callback to this value (get_custom_url in
            # litellm/proxy/utils.py). It must match the redirect URI registered
            # on the Entra app EXACTLY. Prod is reached through its ingress, so
            # this is the https edge host and the callback is
            # https://litellm.ecouncil.ae/sso/callback.
            #
            # SSO users resolve to internal_user_viewer unless the Entra app
            # carries an app role matching a LiteLLM role name; no role mapping
            # is configured here on purpose. Username/password login stays
            # enabled, so a viewer-role SSO mistake can never lock out the UI.
            - name: PROXY_BASE_URL
              value: "https://litellm.ecouncil.ae"
            - name: MICROSOFT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: litellm-microsoft-sso-prod
                  key: MICROSOFT_CLIENT_ID
                  optional: true
            - name: MICROSOFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litellm-microsoft-sso-prod
                  key: MICROSOFT_CLIENT_SECRET
                  optional: true
            - name: MICROSOFT_TENANT
              valueFrom:
                secretKeyRef:
                  name: litellm-microsoft-sso-prod
                  key: MICROSOFT_TENANT
                  optional: true
            - name: MCP_SOURCE_BROKER_ENABLED
              value: "true"
            # Standard data-plane Service port for the MCP source broker.
            - name: MCP_SOURCE_BROKER_DATA_PLANE_URL
              value: "http://litellm-mcp-broker.adeo-litellm.svc.cluster.local:8888"
            - name: MCP_SOURCE_BROKER_PEPPER
              valueFrom:
                secretKeyRef:
                  name: litellm-mcp-source-broker
                  key: pepper
            - name: MCP_SOURCE_BROKER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: litellm-mcp-source-broker
                  key: service-token
