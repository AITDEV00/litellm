## Egress for the relay: cluster DNS only. In staging the approved origins
## are HTTP loopback targets reached through the agent's inbound WSS
## session (yamux streams dialed from the agent side), so the relay itself
## needs no origin egress. Ingress data port 9092 is reachable only from
## the dev proxy pod; worker 8092 is reached through the nginx ingress only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-mcp-source-agent-relay-dev
  namespace: adeo-litellm
spec:
  podSelector:
    matchLabels:
      app: litellm-mcp-source-agent-relay-dev
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: litellm-proxy-dev
      ports:
        - port: 9092
    - ports:
        - port: 8092
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
