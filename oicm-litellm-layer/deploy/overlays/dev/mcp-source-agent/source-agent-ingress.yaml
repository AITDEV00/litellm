## Public ingress for the source-agent connector upgrade. The agent on a
## source host initiates the WSS connection here; nothing on the source
## host listens. Exact path match keeps it disjoint from /mcp-worker
## (retired) and /mcp-remotedialer-worker (Go remotedialer).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-mcp-source-agent-dev
  namespace: adeo-litellm
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: litellm.ecouncil.ae
      http:
        paths:
          - path: /mcp-source-agent
            pathType: Exact
            backend:
              service:
                name: litellm-mcp-source-agent-relay-dev
                port:
                  name: sa-worker
  tls:
    - hosts:
        - litellm.ecouncil.ae
      secretName: litellm-ecouncil-ae-tls
