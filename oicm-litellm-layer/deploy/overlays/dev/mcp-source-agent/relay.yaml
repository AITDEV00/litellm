## Dev-only staging Deployment for the source-agent reference relay.
##
## This is the received research reference (docs/mcp-source-broker/
## LiteLLM-1.108.5-Source-Agent-Reference.zip) running as a PARALLEL data
## plane next to the existing MCP source broker. It is fully disjoint from
## litellm-mcp-broker-dev: its own Deployment, Service, Ingress path and
## NetworkPolicy. The live 9092/9091/8092 remotedialer path is untouched;
## rollback is `kubectl delete -k` on this directory.
##
## Relay process contract (source-agent relay --help):
##   -worker 8092  public WSS ingress behind approved HTTPS: GET /mcp-source-agent
##   -data   9092  private data listener: /sources/{agent}/{channel}, /v1/observed, /readyz
##   -feed       private desired-snapshot feed (staging: a mounted file)
##   -data-token broker-data.key (LiteLLM-to-relay credential, digest in the feed)
##
## The relay pod reads:
##   /etc/source-agent/authority.yaml   desired snapshot (staging file feed)
##   /etc/source-agent/broker-data.key   LiteLLM-to-relay credential
##   /etc/source-agent/origin-ca.pem     CA for HTTPS origins (staging: HTTP origins)
##
## The authority snapshot and broker-data.key are maintained by the broker
## operator via scripts/source-agent/; they are dev-only Secret/ConfigMap
## manifests in this directory with placeholder-free values created out of
## band (same convention as litellm-mcp-source-broker-dev).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-mcp-source-agent-relay-dev
  namespace: adeo-litellm
  labels:
    app: litellm-mcp-source-agent-relay-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-mcp-source-agent-relay-dev
  template:
    metadata:
      labels:
        app: litellm-mcp-source-agent-relay-dev
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: registry.adeoaiengine.ecouncil.ae/openinnovationai/platform/mlops/mlops-serving/source-agent-relay:staging-0.1.0
          imagePullPolicy: Always
          command:
            - /source-agent
            - relay
            - -worker=0.0.0.0:8092
            - -worker-path=/mcp-source-agent
            - -data=0.0.0.0:9092
            - -policy=/etc/source-agent/authority.yaml
            - -data-token=/etc/source-agent/broker-data.key
          ports:
            - name: sa-worker
              containerPort: 8092
            - name: sa-data
              containerPort: 9092
          readinessProbe:
            httpGet:
              path: /readyz
              port: sa-data
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: authority
              mountPath: /etc/source-agent
              readOnly: true
      volumes:
        - name: authority
          secret:
            secretName: litellm-mcp-source-agent-relay-dev
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-mcp-source-agent-relay-dev
  namespace: adeo-litellm
  labels:
    app: litellm-mcp-source-agent-relay-dev
spec:
  selector:
    app: litellm-mcp-source-agent-relay-dev
  ports:
    - name: sa-worker
      port: 8092
      targetPort: sa-worker
    - name: sa-data
      port: 9092
      targetPort: sa-data
