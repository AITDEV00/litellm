# Dev's ingress `from` labels, patched onto the base NetworkPolicy. The base
# carries the prod gateway label; this points the policy at dev's gateway and
# dev's bootstrap Job instead. The `podSelector` is not set here: the overlay's
# `replacements` already rewrites it to `rustfs-dev`, the store's own label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustfs
  namespace: adeo-litellm
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: litellm-proxy-dev
        # The store's own label. It selects the dev store pod and the dev
        # bootstrap Job, both of which carry it.
        - podSelector:
            matchLabels:
              app: rustfs-dev
