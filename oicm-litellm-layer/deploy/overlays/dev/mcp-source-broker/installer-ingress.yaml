apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-mcp-enrollment-dev
  namespace: adeo-litellm
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: litellm.ecouncil.ae
      http:
        paths:
          - path: /(mcp-sources)$
            pathType: ImplementationSpecific
            backend:
              service:
                name: litellm-proxy-dev
                port:
                  number: 4000
          - path: /(mcp-source-broker/install/[A-Za-z0-9-]+)$
            pathType: ImplementationSpecific
            backend:
              service:
                name: litellm-proxy-dev
                port:
                  number: 4000
  tls:
    - hosts:
        - litellm.ecouncil.ae
      secretName: litellm-ecouncil-ae-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-mcp-public-mirror-dev
  namespace: adeo-litellm
  labels:
    app: litellm-proxy-dev
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: $1
spec:
  ingressClassName: nginx
  rules:
    - host: litellm.ecouncil.ae
      http:
        paths:
          - path: /mcp-source-broker/public(/install/.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: litellm-proxy-dev
                port:
                  number: 4000
  tls:
    - hosts:
        - litellm.ecouncil.ae
      secretName: litellm-ecouncil-ae-tls
