## Dev-only source-link data plane for the MCP source broker.
##
## Adds a Go worker sidecar to the dev broker Deployment. The sidecar
## shares the pod network namespace with the Python control app, which is a
## load-bearing constraint: the Go revocation endpoint accepts loopback
## callers only, so the FastAPI remote control app (port 9091) must be able
## to reach it on 127.0.0.1.
##
## Port map inside the one pod (Service-facing names in backticks):
##   9091  FastAPI source-link control `remote-control` (the broker process)
##   9092  Go private dispatch `link-data`: /sources/{id}/{path}, /v1/source-link/revoke (sidecar)
##   8093  Go tunnel ingress `link-tunnel`: /grpctunnel.v1.TunnelService/* (sidecar)
##
## The Service below publishes these on the litellm-mcp-broker-dev Service.
## The gateway-facing data plane is the STANDARD Service port 8888, which
## targets the sidecar's link-data listener; the gateway's pool URL always
## points at 8888, never at a container port. The data listener accepts both
## HTTP/1.1 (gateway revocation and kubelet readiness) and h2c (gRPC workloads
## and multiplexed load clients). The grpctunnel ingress stays h2c-only.
##
## A custom tag changed through this patch needs `kubectl apply -k` afterwards;
## `make mcp-sidecar-release` sets the tag and digest for you, deletes the pod,
## and does not choose a new tag name. The tag is the mutable dev channel
## (`<branch>-dev`); `make mcp-sidecar-pin` rewrites it together with the digest
## of the bytes it resolved to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-mcp-broker-dev
  namespace: adeo-litellm
spec:
  template:
    spec:
      containers:
        - name: broker
          env:
            - name: MCP_SOURCE_LINK_ENABLED
              value: "true"
        - name: source-link
          image: registry.adeoaiengine.ecouncil.ae/openinnovationai/platform/mlops/mlops-serving/mcp-source-link-worker:jya0-v1.108.5-dev@sha256:41883c901577878ded0dc2707d0482eaffbefa386c329ddd845e1496bed54c7b
          imagePullPolicy: Always
          command: ["/source-link", "worker"]
          env:
            - name: MCP_SOURCE_LINK_CONTROL_URL
              value: http://127.0.0.1:9091
            - name: MCP_SOURCE_BROKER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: litellm-mcp-source-broker-dev
                  key: service-token
            - name: MCP_SOURCE_LINK_DATA_LISTEN
              value: "0.0.0.0:9092"
            - name: MCP_SOURCE_LINK_REVERSE_LISTEN
              value: "0.0.0.0:8093"
          ports:
            - name: link-data
              containerPort: 9092
            - name: link-tunnel
              containerPort: 8093
          readinessProbe:
            httpGet:
              path: /readyz
              port: link-data
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "8"
              memory: 16Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-mcp-broker-dev
  namespace: adeo-litellm
spec:
  ports:
    - name: data
      port: 8888
      targetPort: link-data
    - name: link-tunnel
      port: 8093
      targetPort: link-tunnel
    - name: remote-control
      port: 9091
      targetPort: 9091
