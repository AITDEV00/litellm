## Public ingress for the grpctunnel connector transport. The connector on a
## source host initiates one multiplexed HTTP/2 session here; nothing on the
## source host listens. The GRPC backend protocol switches nginx to grpc_pass,
## which proxies cleartext HTTP/2 (h2c) to the sidecar's tunnel listener on
## 8093, so HTTP/2 stream multiplexing survives the hop through the cluster.
## Only /grpctunnel.v1.TunnelService/ is published: the four reverse-h2
## long-poll routes were deleted with that data plane and would 404.
##
## proxy-body-size must stay unlimited: the reverse tunnel is ONE long-lived
## client-streaming POST whose body accumulates every pushed RPC request,
## unbounded over the tunnel's lifetime. nginx's default client_max_body_size
## (1m) kills the tunnel with "too large chunked body" once the cumulative
## request bytes pass 1MB, which under load happens within tens of seconds and
## drops every in-flight dispatch as a 502.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-mcp-tunnel-dev
  namespace: adeo-litellm
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  rules:
    - host: litellm.ecouncil.ae
      http:
        paths:
          - path: /grpctunnel.v1.TunnelService/
            pathType: Prefix
            backend:
              service:
                name: litellm-mcp-broker-dev
                port:
                  name: link-tunnel
  tls:
    - hosts:
        - litellm.ecouncil.ae
      secretName: litellm-ecouncil-ae-tls
