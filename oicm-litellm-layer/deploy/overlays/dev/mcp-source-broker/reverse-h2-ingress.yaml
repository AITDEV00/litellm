## Public ingress for the reverse-h2 connector transport. The connector on a
## source host initiates one multiplexed HTTP/2 session here; nothing on the
## source host listens. The GRPC backend protocol switches nginx to grpc_pass,
## which proxies cleartext HTTP/2 (h2c) to the sidecar's reverse listener on
## 8093, so HTTP/2 stream multiplexing survives the hop through the cluster.
## The same listener also carries the grpctunnel plane at
## /grpctunnel.v1.TunnelService/ once a connector selects MCP_SOURCE_LINK_TRANSPORT=tunnel.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-mcp-reverse-h2-dev
  namespace: adeo-litellm
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: litellm.ecouncil.ae
      http:
        paths:
          - path: /mcp-source-link-reverse
            pathType: Prefix
            backend:
              service:
                name: litellm-mcp-broker-dev
                port:
                  name: link-reverse
          - path: /mcp-source-link-hold
            pathType: Prefix
            backend:
              service:
                name: litellm-mcp-broker-dev
                port:
                  name: link-reverse
          - path: /mcp-source-link-dispatch
            pathType: Prefix
            backend:
              service:
                name: litellm-mcp-broker-dev
                port:
                  name: link-reverse
          - path: /mcp-source-link-respond
            pathType: Prefix
            backend:
              service:
                name: litellm-mcp-broker-dev
                port:
                  name: link-reverse
          - path: /grpctunnel.v1.TunnelService/
            pathType: Prefix
            backend:
              service:
                name: litellm-mcp-broker-dev
                port:
                  name: link-reverse
  tls:
    - hosts:
        - litellm.ecouncil.ae
      secretName: litellm-ecouncil-ae-tls
