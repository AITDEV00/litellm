# Dev PodDisruptionBudget selector.
#
# Same reason as the Service: the base PDB selects `app: litellm-proxy`, the prod
# pod label. A dev PDB that selects prod pods would count prod replicas toward
# the dev budget, and a dev eviction could be judged against the wrong set. The
# dev pods carry `app: litellm-proxy-dev`, so the budget must name that value.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm-proxy-pdb
  namespace: adeo-litellm
spec:
  selector:
    matchLabels:
      app: litellm-proxy-dev
