# The per-environment gateway, renamed and patched for dev.
#
# `nameSuffix` here applies to the gateway resources only, because this is a
# nested kustomization. The shared ConfigMap and Redis Secret are pulled in one
# level up, without a suffix, so both environments reference the same objects.
#
# Both patches target the BASE names (`litellm-proxy`, `litellm-config`), because
# Kustomize applies patches before the suffix. They must also carry the base's
# namespace, or their resource ID is `[noNs]` and they match nothing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/gateway

nameSuffix: -dev

# The pod label, declared once. The base hardcodes `app: litellm-proxy` in five
# places that must agree or pods route to the wrong environment: the Service
# selector, the PDB selector, the Deployment selector, the pod template labels,
# and the topology spread constraint. `nameSuffix` renames objects but rewrites
# no selector, so a dev object left at the base value selects the PROD pods.
#
# This transformer rewrites all five from one declaration, so the value cannot
# drift between them and a future environment cannot forget one. It also adds
# `app: litellm-proxy-dev` to every object's own labels.
labels:
  - pairs:
      app: litellm-proxy-dev
    includeSelectors: true

patches:
  # Deployment: replica shape, worker count, and the dev-only Secrets and DB.
  - path: deployment.yaml
  # ConfigMap: the config values that genuinely differ on dev.
  - path: config.yaml
  # Drop the base DB Secret from dev entirely. `nameSuffix` would otherwise
  # clone it as `litellm-db-credentials-dev` carrying PROD's connection string,
  # which the dev gateway then used to write to the prod database. Dev reads
  # CNPG's own `adeo-litellm-postgres-dev-app` Secret instead, so a `-dev` copy
  # of this Secret must not exist to point at by mistake.
  - target:
      kind: Secret
      name: litellm-db-credentials
      namespace: adeo-litellm
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: litellm-db-credentials
        namespace: adeo-litellm
