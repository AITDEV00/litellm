# The per-environment gateway, renamed and patched for dev.
#
# `nameSuffix` here applies to the gateway resources only, because this is a
# nested kustomization. The shared ConfigMap and Redis Secret are pulled in one
# level up, without a suffix, so both environments reference the same objects.
#
# Both patches target the BASE names (`litellm-proxy`, `litellm-config`), because
# Kustomize applies patches before the suffix. They must also carry the base's
# namespace, or their resource ID is `[noNs]` and they match nothing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/gateway

nameSuffix: -dev

patches:
  # Deployment: selector/pod labels, replica shape, worker count, and the
  # dev-only Secrets and DB.
  - path: deployment.yaml
  # Service: the selector, so the dev Service routes to the dev pod. Without it
  # the dev Service selects the prod pods (the base selector is the prod label)
  # and anything pointed at it reads and writes production.
  - path: service.yaml
  # PodDisruptionBudget: the selector, so the dev budget counts dev pods.
  - path: pdb.yaml
  # ConfigMap: the config values that genuinely differ on dev.
  - path: config.yaml
