---
# DO NOT APPLY THIS FILE. It is a disaster-recovery record, not a deployment.
#
# These two PVCs bind the pre-existing PersistentVolumes that still hold the
# previous mlops PostgreSQL data, so that data can be reached. The PVs exist
# (Released, Retain, 298d); the PVCs deliberately do not, because a bound PVC
# would keep the volumes from being reclaimed by anything else.
#
# This is a record of how the pre-migration data can be reached, NOT a step in
# the restore in restore-prod-postgres-from-snapshots.yaml. That restore reads
# the litellm-recovery-* snapshots, whose source PVCs were the separately named
# inspect-old-litellm-* PVCs.
#
# Applying this file is harmless on its own (it only creates two PVCs) but it
# exists only to keep the data reachable, so it is kept out of the deployable
# manifests and applied by no Makefile target.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: old-litellm-postgres-data
  namespace: adeo-litellm
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: longhorn-rwx-crypto-retain
  volumeName: pvc-02ee8324-5eb1-449f-829c-2eb293218687
  resources:
    requests:
      storage: 100Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: old-litellm-postgres-wal
  namespace: adeo-litellm
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: longhorn-rwx-crypto-retain
  volumeName: pvc-3ac61ea4-bfd6-4b6e-a3c8-8e5a95c726bf
  resources:
    requests:
      storage: 50Gi
