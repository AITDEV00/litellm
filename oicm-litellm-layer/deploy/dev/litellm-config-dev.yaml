---
# Dev-only ConfigMap: litellm-config-dev
#
# PURPOSE
#   A dev-specific copy of the shared `litellm-config` ConfigMap used to test
#   config changes (e.g. `require_auth_for_metrics_endpoint`) on the dev proxy
#   WITHOUT touching the live production config. The dev Deployment
#   `litellm-proxy-dev` mounts this ConfigMap instead of the shared one.
#
# KEEP IN SYNC
#   Any change to the shared `litellm-config` in deploy/prod/litellm-proxy.yaml
#   that should apply to dev too must be mirrored here.
#
# DIFF VS PROD
#   - require_auth_for_metrics_endpoint: true  (prod sets false)
#
# APPLY
#   kubectl --kubeconfig=$KUBECONFIG -n adeo-litellm apply -f deploy/dev/litellm-config-dev.yaml
#   kubectl --kubeconfig=$KUBECONFIG -n adeo-litellm rollout restart deployment/litellm-proxy-dev
#
# CLEANUP
#   kubectl --kubeconfig=$KUBECONFIG -n adeo-litellm delete configmap litellm-config-dev
#   (and restore deploy/dev/litellm-proxy-dev.yaml volume to `litellm-config`)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config-dev
  namespace: adeo-litellm
data:
  config.yaml: |
    model_list: []
    litellm_settings:
      store_model_in_db: true
      cache: true
      cache_params:
        type: redis
        ttl: 3600
        default_in_memory_ttl: 60
        max_connections: 500
        socket_timeout: 10.0
      enable_redis_auth_cache: true
      callbacks:
        - litellm_hooks.vllm_param_injector.vllm_param_injector
        - dynamic_rate_limiter_v3_htb
        - litellm_hooks.priority_bridge.priority_bridge
        - prometheus
      require_auth_for_metrics_endpoint: true
      priority_reservation:
        prior1: 0.50
        prior2: 0.30
        prior3: 0.20
      priority_reservation_settings:
        saturation_threshold: 1.0
      priority_body_fields:
        prior1:
          priority: 0
        prior2:
          priority: 100
        prior3:
          priority: 200
      # EXEMPT METHOD: prior1 is fully exempt from priority enforcement (cap = 100% model RPM).
      # prior2 and prior3 fall into a shared default_pool at default_priority.
      # Use key-level rpm_limit on individual API keys to separate prior2/prior3.
      # priority_reservation:
      #   prior1: 1.0
      # priority_reservation_settings:
      #   saturation_threshold: 0.75
      #   default_priority: 0.50
    router_settings:
      routing_strategy: usage-based-routing-v2
      optional_pre_call_checks:
        - enforce_model_rate_limits
      # ---- Retry budget per exception class (preemptive, post-OOM hardening).
      # AuthenticationError / BadRequest / ContentPolicyViolation almost never
      # self-heal, so don't waste a retry; transient network/5xx do.
      retry_policy:
        InternalServerErrorRetries: 3
        ServiceUnavailableErrorRetries: 3
        TimeoutErrorRetries: 2
        RateLimitErrorRetries: 2
        AuthenticationErrorRetries: 0
        BadRequestErrorRetries: 0
        ContentPolicyViolationErrorRetries: 0
      # Floor for the exponential backoff in _calculate_retry_after; the actual
      # sleep is max(this, INITIAL_RETRY_DELAY * 2**n) plus jitter.
      retry_after: 0.5
      # Per-request and per-stream-chunk upper bounds so a stalled stream
      # fails loud instead of hanging on the outer HTTP timeout. Non-streaming
      # requests on big reasoning models can legitimately take several minutes.
      # stream_timeout must exceed the LONGEST legitimate silence from sglang
      # (which buffers tokens under load and emits them late), not just the
      # average chunk gap. 300s covers Kimi-K3 deep-thinking batches.
      timeout: 600
      stream_timeout: 300
      # Deployment health hysteresis: trip to cooldown after 3 fails, sleep 30s
      # before retrying that deployment (default is 1 fail / 1s).
      allowed_fails: 3
      cooldown_time: 30
      # Fallbacks intentionally omitted for now; to be configured separately.
    general_settings:
      use_redis_transaction_buffer: true
      # Mirror of prod (2026-09-08 decoupling). Retention knobs are inert
      # without a DB but kept identical so dev matches prod exactly.
      maximum_spend_logs_retention_period: "60d"
      maximum_spend_logs_retention_interval: "1h"
      maximum_spend_logs_cleanup_batch_size: 1000
      maximum_spend_logs_cleanup_max_batches: 20000
      maximum_spend_logs_cleanup_run_budget: "20m"
      # The whole point of DB-less dev: with no DATABASE_URL and this flag,
      # auth falls back to a restricted synthetic identity and the proxy
      # starts/serves without Postgres. Validates the prod decoupling.
      allow_requests_on_db_unavailable: true