---
# Dev-only Deployment: oicm-discovery-controller-dev
#
# PURPOSE
#   A second instance of the discovery controller pointed at the DEV gateway, so
#   a discovery or reconciliation change can be exercised against real OICM
#   sources without going through production. It runs the same image, k8s RBAC,
#   node pinning and env as the real controller, so it reproduces the production
#   discovery path (reading Deployments, ConfigMaps, EndpointSlices, probing
#   openapi.json and /v1/models) bit-for-bit.
#
# WHAT IT WRITES
#   This controller is READ-WRITE (`CONTROLLER_READ_ONLY: "false"` below), so it
#   registers, updates and deletes models. It does that against the DEV gateway
#   only: LITELLM_ADMIN_URL points at `litellm-proxy-dev` and it authenticates
#   with the dev master key (`litellm-master-key-dev`). Production is a different
#   gateway, reached with a different key, and nothing here references it.
#
#   Setting `CONTROLLER_READ_ONLY: "true"` makes LiteLLMClient.batch() /
#   register_model() / deregister_model() logged no-ops: discovery and plan
#   computation still run, but every write is logged as "[READ-ONLY] would ..."
#   and the HTTP write calls (/model/new, /model/delete, /model/{id}/update) are
#   never issued. The flag is wired through the LiteLLMClient constructor, so
#   the binary cannot write while it is set, regardless of its env or creds.
#
# SHARED WITH PRODUCTION (deliberate, read the note before editing)
#   - ServiceAccount: this Deployment uses prod's `oicm-discovery-controller`
#     ServiceAccount and therefore prod's Role/RoleBinding in namespace `adeo`.
#     It declares no RBAC of its own. Both instances need exactly the same
#     read-only access (deployments, services, configmaps, endpointslices), so a
#     second set would be a copy; the controller never writes to the k8s API.
#   - `oicm-sources` ConfigMap: both instances mount the SAME sources ConfigMap,
#     while exclusions are split (`oicm-exclusions` prod / `oicm-exclusions-dev`
#     dev). The two controllers do read the same OICM instances, so this is
#     correct today, but it means editing `deploy/oicm/sources.yaml` changes
#     what PROD discovers. A dev-only source experiment must not go there.
#
# CLUSTER_NAME is `alain`, the same value prod uses, because it names the
# physical cluster both instances run in rather than the environment. See the
# note on that env var below.
#
# WHAT THIS IS NOT: a dev controller writing to the dev gateway is still a
# controller that writes. Its only guard against reaching production is
# LITELLM_ADMIN_URL, and nothing checks that at runtime.
#
# HOW TO USE
#   kubectl --kubeconfig=$KUBECONFIG -n adeo-litellm apply -f deploy/dev/discovery-controller-dev.yaml
#   kubectl --kubeconfig=$KUBECONFIG -n adeo-litellm rollout status deploy/oicm-discovery-controller-dev
#   kubectl --kubeconfig=$KUBECONFIG -n adeo-litellm logs deploy/oicm-discovery-controller-dev -f
#   # With CONTROLLER_READ_ONLY=true the logs show exactly what the controller
#   # WOULD register/delete/patch, without doing it. Compare with prod logs to
#   # validate a new discovery change before it reaches production.
#
# CLEANUP
#   kubectl --kubeconfig=$KUBECONFIG -n adeo-litellm delete deploy/oicm-discovery-controller-dev
#
# NOTE: This has NO Service, NO PDB, and a distinct name/labels, so it cannot
#       affect the production controller or receive any production traffic.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oicm-discovery-controller-dev
  namespace: adeo-litellm
  labels:
    app: oicm-discovery-controller-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oicm-discovery-controller-dev
  template:
    metadata:
      labels:
        app: oicm-discovery-controller-dev
    spec:
      # Prod's ServiceAccount and Role: both instances need identical read-only
      # access to namespace `adeo`, and the controller never writes to the k8s
      # API. See the "SHARED WITH PRODUCTION" note at the top of this file.
      serviceAccountName: oicm-discovery-controller
      nodeSelector:
        kubernetes.io/hostname: adeo-gpu-03
      tolerations:
        - key: tenant
          value: adeo
          effect: NoSchedule
        - key: tenant
          value: adeo
          effect: NoExecute
        - key: target
          value: k8s
          effect: NoSchedule
        - key: target
          value: k8s
          effect: NoExecute
        - key: nvidia.com/gpu
          effect: NoSchedule
      containers:
        - name: controller
          image: registry.adeoaiengine.ecouncil.ae/openinnovationai/platform/mlops/mlops-serving/oicm-discovery-controller:0.1.0-20261008-ddb2e95
          # The version tag is immutable (semver + date + git SHA), so a node
          # reboot or rollout can never pull a different build than the one
          # pinned here. Use IfNotPresent so a re-pull only happens when the tag
          # actually changes. `make controller-release` rewrites the tag.
          imagePullPolicy: IfNotPresent
          env:
            - name: WATCH_NAMESPACE
              value: "adeo"
            # The cluster this controller runs in. It is the default `cluster`
            # for a LOCAL deployment, which is then persisted as `oicm_cluster`;
            # a Submariner import takes the source cluster from the source's own
            # `cluster` field in oicm-sources instead. It names the physical
            # cluster, not the environment, so dev and prod share the value: both
            # run in Al Ain, and their local deployments really are there.
            - name: CLUSTER_NAME
              value: "alain"
            - name: LITELLM_ADMIN_URL
              value: "http://litellm-proxy-dev.adeo-litellm.svc.cluster.local:4000"
            - name: LITELLM_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key-dev
                  key: master-key
            - name: CLUSTER_DOMAIN
              value: "svc.cluster.local"
            - name: MODEL_PORT
              value: "8080"
            - name: SYNC_INTERVAL
              value: "300"
            - name: ENABLE_SUBMARINER_IMPORTS
              value: "true"
            # READ-WRITE: this controller registers and updates models on the dev
            # gateway, so the dev DB mirrors prod's model discovery. It only ever
            # talks to litellm-proxy-dev (LITELLM_ADMIN_URL) with the dev master
            # key, so production is untouched. Set this to "true" to return to
            # log-only mode and make every write a logged no-op.
            - name: CONTROLLER_READ_ONLY
              value: "false"
            # OICM status sources. Which instances exist (endpoints, realm,
            # workspace) is declared in the oicm-sources ConfigMap, mounted at
            # /etc/oicm. Credentials are NOT in the ConfigMap: a ConfigMap cannot
            # hold or interpolate a Secret value, so each source's credentials
            # are wired here from its own Secret, under variable names derived
            # from the source name in sources.yaml.
            #
            # Both OICMs are read at once. Al Ain is in-cluster; Abu Dhabi is
            # reached over Submariner, and its clusterset.local names resolve
            # only from pods on the Al Ain gateway node adeo-gpu-03, which is
            # what the nodeSelector at the top of this manifest pins.
            #
            # Keep this in step with sources.yaml: a source listed there whose
            # credentials are absent here is skipped with a warning.
            - name: OICM_SOURCES_FILE
              value: "/etc/oicm/sources.yaml"
            # Models the controller must never register. Declared in the
            # dev-only oicm-exclusions-dev ConfigMap (production has its own
            # list in oicm-exclusions), mounted alongside the sources file. An
            # excluded model is deleted if already registered, so it disappears
            # from /v1/models entirely rather than just leaving the routing pool.
            - name: OICM_EXCLUSIONS_FILE
              value: "/etc/oicm-exclusions/exclusions.yaml"
            - name: OICM_SOURCE_ALAIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oicm-status-api
                  key: username
            - name: OICM_SOURCE_ALAIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oicm-status-api
                  key: password
            - name: OICM_SOURCE_ABUDHABI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ad-oicm-status-api
                  key: username
            - name: OICM_SOURCE_ABUDHABI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ad-oicm-status-api
                  key: password
            - name: STATUS_SYNC_INTERVAL
              value: "10"
            # How long a source's last successful poll may be old before its
            # status is reported unknown rather than trusted. The heartbeat
            # write cadence is derived from this as STATUS_STALE_AFTER / 3.
            - name: STATUS_STALE_AFTER
              value: "90"
          volumeMounts:
            - name: oicm-sources
              mountPath: /etc/oicm
              readOnly: true
            - name: oicm-exclusions
              mountPath: /etc/oicm-exclusions
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        # Shared with prod on purpose; exclusions below are not. See the
        # "SHARED WITH PRODUCTION" note at the top of this file.
        - name: oicm-sources
          configMap:
            name: oicm-sources
        - name: oicm-exclusions
          configMap:
            name: oicm-exclusions-dev
