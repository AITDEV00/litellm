---
# ROLLBACK MANIFEST: revert the prod master-key / salt-key change
#
# Restores prod to the PREVIOUS working state:
#   - litellm-master-key  -> sk-1234  (auth / admin key)
#   - removes the LITELLM_SALT_KEY pin (salt falls back to master = sk-1234)
#   - deletes the litellm-salt-key secret created by the forward change
#
# WHY THIS EXISTS
#   deploy/prod/litellm-proxy.yaml changed the master key to sk-05132025 and
#   pinned LITELLM_SALT_KEY to sk-1234. If that change breaks prod, apply THIS
#   file to return to the exact previous working configuration.
#
# APPLY ORDER (run the proxy first, then the controller)
#   KUBECONFIG=$HOME/.kube/oicm-alain.conf \
#     kubectl apply -f deploy/rollback/litellm-proxy-rollback-key.yaml
#   KUBECONFIG=$HOME/.kube/oicm-alain.conf \
#     kubectl apply -f deploy/rollback/discovery-controller-rollback-key.yaml
#   KUBECONFIG=$HOME/.kube/oicm-alain.conf \
#     kubectl rollout restart deployment/litellm-proxy -n mlops
#   KUBECONFIG=$HOME/.kube/oicm-alain.conf \
#     kubectl rollout restart deployment/oicm-discovery-controller -n mlops
#
# VERIFY ROLLBACK
#   kubectl -n mlops rollout status deployment/litellm-proxy
#   kubectl -n mlops get secret litellm-master-key -o jsonpath='{.data.master-key}' | base64 -d
#   # -> sk-1234
#   curl -s -o /dev/null -w "%{http_code}\n" \
#     -H "Authorization: Bearer sk-1234" http://127.0.0.1:4000/v1/models
#   # -> 200
#
# NOTE: This does NOT touch the DB. It only restores the keys the proxy/controller
#       use. It is safe to apply at any time and is idempotent with the current
#       forward state.

---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-master-key
  namespace: mlops
type: Opaque
stringData:
  master-key: sk-1234
---
# Removes the salt key secret so LITELLM_SALT_KEY falls back to the master key.
# (Deleting the secret means any env var referencing it fails to resolve; the
# forward deployment that references it is overwritten by this rollback's
# deployment below, which no longer references it.)
apiVersion: v1
kind: Secret
metadata:
  name: litellm-salt-key
  namespace: mlops
type: Opaque
stringData:
  salt-key: sk-1234
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-db-credentials
  namespace: mlops
type: Opaque
stringData:
  DATABASE_URL: "postgresql://litellm:litellm_proxy_2025@mlops-postgres-rw.mlops:5432/litellm"
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-redis-password
  namespace: mlops
type: Opaque
stringData:
  password: litellm-redis-7f3a9b2e
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: mlops
data:
  config.yaml: |
    model_list: []
    litellm_settings:
      store_model_in_db: true
      cache: true
      cache_params:
        type: redis
        ttl: 3600
        default_in_memory_ttl: 60
        max_connections: 500
        socket_timeout: 10.0
      enable_redis_auth_cache: true
      callbacks:
        - litellm_hooks.vllm_param_injector.vllm_param_injector
        - dynamic_rate_limiter_v3_htb
        - litellm_hooks.priority_bridge.priority_bridge
        - prometheus
      require_auth_for_metrics_endpoint: false
      priority_reservation:
        prior1: 0.50
        prior2: 0.30
        prior3: 0.20
      priority_reservation_settings:
        saturation_threshold: 1.0
      priority_body_fields:
        prior1:
          priority: 0
        prior2:
          priority: 100
        prior3:
          priority: 200
    router_settings:
      routing_strategy: usage-based-routing-v2
      optional_pre_call_checks:
        - enforce_model_rate_limits
    general_settings:
      use_redis_transaction_buffer: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-hooks
  namespace: mlops
data:
  vllm_param_injector.py: |
    import os
    from typing import Any, Dict, Optional
    from litellm.integrations.custom_logger import CustomLogger
    from litellm.utils import get_secret


    class VllmParamInjector(CustomLogger):
        """Pre-call hook that injects vLLM-specific parameters from the
        upstream model deployment's ConfigMap into the request."""

        @staticmethod
        def _target_matches(model_info: dict, target_model: str) -> bool:
            litellm_params = model_info.get("litellm_params", {})
            return litellm_params.get("model", "") == target_model

        async def async_pre_call_hook(
            self,
            user_api_key_dict: Dict,
            cache: Any,
            data: Dict,
            call_type: str,
        ) -> Optional[Dict]:
            from litellm.proxy.proxy_server import llm_router

            if llm_router is None or not hasattr(llm_router, "get_model_list"):
                return data

            target_model = data.get("model")
            if not target_model:
                return data

            for model_info in llm_router.get_model_list():
                if self._target_matches(model_info, target_model):
                    model_info_extra = model_info.get("model_info", {})
                    extra_body = {}
                    for key, value in model_info_extra.items():
                        if key.startswith("vllm_") and value is not None:
                            param_name = key[len("vllm_"):]
                            extra_body[param_name] = value
                    if extra_body:
                        existing = data.get("extra_body") or {}
                        existing.update(extra_body)
                        data["extra_body"] = existing
                    break

            return data


    vllm_param_injector = VllmParamInjector()
  priority_bridge.py: |
    import logging
    from typing import Optional, Union

    import litellm
    from litellm.integrations.custom_logger import CustomLogger
    from litellm.caching import DualCache
    from litellm.proxy._types import UserAPIKeyAuth
    from litellm.proxy.hooks.dynamic_rate_limiter_v3_htb import htb_priority
    from litellm.types.utils import CallTypesLiteral

    logger = logging.getLogger("oicm-priority-bridge")

    _CHAT_CALL_TYPES: frozenset[str] = frozenset({"completion", "acompletion"})


    class PriorityBridge(CustomLogger):

        async def async_pre_call_hook(
            self,
            user_api_key_dict: UserAPIKeyAuth,
            cache: DualCache,
            data: dict,
            call_type: CallTypesLiteral,
        ) -> Optional[Union[Exception, str, dict]]:
            body_fields_map = litellm.priority_body_fields
            if not body_fields_map:
                return None

            if call_type not in _CHAT_CALL_TYPES:
                return None

            htb_prio = htb_priority.get()
            if htb_prio is None:
                return None

            body_fields = body_fields_map.get(htb_prio)
            if not body_fields:
                return None

            extra_body = data.get("extra_body") or {}
            extra_body.update(body_fields)
            data["extra_body"] = extra_body

            logger.debug(
                "Injected priority body fields for htb_priority=%s: %s",
                htb_prio,
                list(body_fields.keys()),
            )

            return data


    priority_bridge = PriorityBridge()
---
# LiteLLM Proxy Deployment (ROLLBACK: master-key sk-1234, no salt pin)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: mlops
  labels:
    app: litellm-proxy
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
    spec:
      nodeSelector:
        kubernetes.io/hostname: adeo-gpu-03
      tolerations:
        - key: tenant
          value: adeo
          effect: NoSchedule
        - key: tenant
          value: adeo
          effect: NoExecute
        - key: target
          value: k8s
          effect: NoSchedule
        - key: target
          value: k8s
          effect: NoExecute
        - key: nvidia.com/gpu
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: litellm-proxy
      containers:
        - name: litellm
          image: registry.adeoaiengine.ecouncil.ae/openinnovationai/platform/mlops/mlops-serving/litellm-src:jya0-v1.97.0
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            - name: UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-db-credentials
                  key: DATABASE_URL
            - name: REDIS_HOST
              value: "litellm-redis.redis.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-redis-password
                  key: password
            - name: REDIS_CONNECTION_POOL_TIMEOUT
              value: "10"
            - name: UI_LOGO_PATH
              value: /app/assets/adeo-ai-gateway.jpg
            - name: LITELLM_FAVICON_URL
              value: /app/assets/favicon.png
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.kube-prometheus-stack:9090"
          command:
            - "litellm"
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
            - "--run_granian"
            - "--num_workers"
            - "4"
            - "--use_v2_migration_resolver"
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: hooks
              mountPath: /app/litellm_hooks
              readOnly: true
            - name: logo
              mountPath: /app/assets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: hooks
          configMap:
            name: litellm-hooks
        - name: logo
          configMap:
            name: litellm-logo
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: mlops
  labels:
    app: litellm-proxy
spec:
  selector:
    app: litellm-proxy
  ports:
    - port: 4000
      targetPort: http
      name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm-proxy-pdb
  namespace: mlops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: litellm-proxy