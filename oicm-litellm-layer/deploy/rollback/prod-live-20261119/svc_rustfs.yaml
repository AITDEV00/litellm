apiVersion: v1
kind: Service
metadata:
  labels:
    app: rustfs
  name: rustfs
  namespace: adeo-litellm
spec:
  clusterIP: 10.43.189.232
  clusterIPs:
  - 10.43.189.232
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: endpoint
    port: 9000
    protocol: TCP
    targetPort: endpoint
  - name: console
    port: 9001
    protocol: TCP
    targetPort: console
  selector:
    app: rustfs
  sessionAffinity: None
  type: ClusterIP
