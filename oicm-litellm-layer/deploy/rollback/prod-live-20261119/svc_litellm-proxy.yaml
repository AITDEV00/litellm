apiVersion: v1
kind: Service
metadata:
  labels:
    app: litellm-proxy
  name: litellm-proxy
  namespace: adeo-litellm
spec:
  clusterIP: 10.43.35.166
  clusterIPs:
  - 10.43.35.166
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 4000
    protocol: TCP
    targetPort: http
  selector:
    app: litellm-proxy
  sessionAffinity: None
  type: ClusterIP
