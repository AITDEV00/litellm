apiVersion: v1
kind: ConfigMap
metadata:
  name: spend-logs-janitor-scripts-prod
  namespace: adeo-litellm
  labels:
    app.kubernetes.io/component: spend-logs-janitor
    app.kubernetes.io/part-of: litellm-prod
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spend-logs-janitor-prod
  namespace: adeo-litellm
  labels:
    app.kubernetes.io/component: spend-logs-janitor
    app.kubernetes.io/part-of: litellm-prod
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata: {}
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: spend-logs-janitor
        spec:
          containers:
          - command:
            - /bin/bash
            - /scripts/janitor.sh
            env:
            - name: ARCHIVE_ROOT
              value: /archive
            - name: MASTER_TABLE
              value: LiteLLM_SpendLogs
            - name: ARCHIVE_LEDGER
              value: LiteLLM_SpendLogsArchiveLedger
            - name: RETENTION_DAYS
              value: '60'
            - name: RETENTION_FLOOR_HOURS
              value: '24'
            - name: PRESSURE_THRESHOLD_BYTES
              value: '80530636800'
            - name: DB_HOST
              value: adeo-litellm-postgres-rw
            - name: DB_PORT
              value: '5432'
            - name: DB_NAME
              value: litellm
            - name: DB_USER
              value: oicm
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: adeo-litellm-postgres-app
            image: ghcr.io/cloudnative-pg/postgresql:17.5
            imagePullPolicy: IfNotPresent
            name: janitor
            resources:
              limits:
                cpu: '1'
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 256Mi
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            volumeMounts:
            - mountPath: /archive
              name: archive
            - mountPath: /scripts
              name: scripts
              readOnly: true
          dnsPolicy: ClusterFirst
          imagePullSecrets:
          - name: registry-credentials
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext:
            fsGroup: 0
            runAsUser: 0
          terminationGracePeriodSeconds: 30
          volumes:
          - name: archive
            persistentVolumeClaim:
              claimName: spend-logs-archive-prod
          - configMap:
              defaultMode: 493
              name: spend-logs-janitor-scripts-prod
            name: scripts
  schedule: 0 */2 * * *
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  suspend: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spend-logs-archive-prod
  namespace: adeo-litellm
  labels:
    app.kubernetes.io/component: spend-logs-archival
    app.kubernetes.io/part-of: litellm-prod
  annotations:
    pv.kubernetes.io/bind-completed: 'yes'
    pv.kubernetes.io/bound-by-controller: 'yes'
    volume.beta.kubernetes.io/storage-provisioner: driver.longhorn.io
    volume.kubernetes.io/storage-provisioner: driver.longhorn.io
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  storageClassName: longhorn-rwx-crypto-retain-recovery
  volumeMode: Filesystem
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: adeo-litellm-postgres
  namespace: adeo-litellm
spec:
  affinity:
    podAntiAffinityType: preferred
  bootstrap:
    initdb:
      database: oicm
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: oicm
  description: mlops database cluster
  enablePDB: true
  enableSuperuserAccess: true
  failoverDelay: 0
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  instances: 1
  logLevel: info
  maxSyncReplicas: 0
  minSyncReplicas: 0
  monitoring:
    customQueriesConfigMap:
    - key: queries
      name: cnpg-default-monitoring
    disableDefaultQueries: false
    enablePodMonitor: true
  postgresGID: 26
  postgresUID: 26
  postgresql:
    parameters:
      archive_mode: 'on'
      archive_timeout: 5min
      dynamic_shared_memory_type: posix
      full_page_writes: 'on'
      log_destination: csvlog
      log_directory: /controller/log
      log_filename: postgres
      log_rotation_age: '0'
      log_rotation_size: '0'
      log_truncate_on_rotation: 'false'
      logging_collector: 'on'
      max_connections: '200'
      max_parallel_workers: '32'
      max_replication_slots: '32'
      max_worker_processes: '32'
      pg_stat_statements.max: '10000'
      pg_stat_statements.track: all
      shared_buffers: 256MB
      shared_memory_type: mmap
      shared_preload_libraries: ''
      ssl_max_protocol_version: TLSv1.3
      ssl_min_protocol_version: TLSv1.3
      wal_keep_size: 512MB
      wal_level: logical
      wal_log_hints: 'on'
      wal_receiver_timeout: 5s
      wal_sender_timeout: 5s
    shared_preload_libraries:
    - pg_stat_statements
    syncReplicaElectionConstraint:
      enabled: false
  primaryUpdateMethod: restart
  primaryUpdateStrategy: unsupervised
  replicationSlots:
    highAvailability:
      enabled: true
      slotPrefix: _cnpg_
    synchronizeReplicas:
      enabled: true
    updateInterval: 30
  resources:
    limits:
      cpu: '1'
      memory: 8G
    requests:
      cpu: 500m
      memory: 2G
  smartShutdownTimeout: 180
  startDelay: 30
  stopDelay: 100
  storage:
    resizeInUseVolumes: true
    size: 200Gi
    storageClass: longhorn-rwx-crypto-retain-recovery
  switchoverDelay: 3600
  walStorage:
    resizeInUseVolumes: true
    size: 50Gi
    storageClass: longhorn-rwx-crypto-retain-recovery
