--- 
# Deployment manifest for the OICM Discovery Controller
# This runs as a separate Deployment in the mlops namespace,
# watching the adeo namespace for model deployments.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oicm-discovery-controller
  namespace: mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oicm-discovery-controller
  namespace: adeo
rules:
  # Read deployments (to discover model deployments)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  # Read services (to get ClusterIP for health checks)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  # Read configmaps (to get MODEL_ID)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oicm-discovery-controller
  namespace: adeo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oicm-discovery-controller
subjects:
  - kind: ServiceAccount
    name: oicm-discovery-controller
    namespace: mlops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oicm-discovery-controller
  namespace: mlops
  labels:
    app: oicm-discovery-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oicm-discovery-controller
  template:
    metadata:
      labels:
        app: oicm-discovery-controller
    spec:
      serviceAccountName: oicm-discovery-controller
      containers:
        - name: controller
          image: registry.adeoaiengine.ecouncil.ae/openinnovationai/platform/mlops/mlops-serving/oicm-discovery-controller:latest
          env:
            - name: WATCH_NAMESPACE
              value: "adeo"
            - name: LITELLM_ADMIN_URL
              value: "http://litellm-proxy.mlops.svc.cluster.local:4000"
            - name: LITELLM_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            - name: CLUSTER_DOMAIN
              value: "svc.cluster.local"
            - name: MODEL_PORT
              value: "8080"
            - name: SYNC_INTERVAL
              value: "300"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
