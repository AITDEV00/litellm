---
# The OICM service account the status controller authenticates as.
#
# NOT COMMITTED AS-IS: this file is a template. It is named for the Secret the
# controller manifests already reference (OICM_USERNAME / OICM_PASSWORD in
# deploy/dev/discovery-controller-dev.yaml and deploy/prod/discovery-controller.yaml),
# so applying it produces exactly the object those manifests expect.
#
# Generate it with scripts/make_service_account_secrets.sh, which creates a
# random password, writes this Secret, and hands the same password to the
# provisioning Job so the two cannot drift.
#
# To write it by hand:
#   kubectl -n adeo-litellm create secret generic oicm-status-api \
#     --from-literal=username=svc-litellm-controller \
#     --from-literal=password="$(openssl rand -base64 24 | tr -d '/+=' | head -c 28)"
#
# The password here is the source of truth for the account, and the
# provisioning Job re-sets it from this Secret on every run.
---
apiVersion: v1
kind: Secret
metadata:
  name: oicm-status-api
  namespace: adeo-litellm
type: Opaque
stringData:
  username: svc-litellm-controller
  password: REPLACE_ME
---
# The Abu Dhabi service account. Separate from the Al Ain one above because the
# two are distinct accounts in distinct realms, and because which cluster the
# controller reads is a deployment decision.
#
# NOT COMMITTED AS-IS: this file is a template. Generate it with
# scripts/make_service_account_secrets.sh abudhabi.
---
apiVersion: v1
kind: Secret
metadata:
  name: ad-oicm-status-api
  namespace: adeo-litellm
type: Opaque
stringData:
  username: svc-litellm-controller
  password: REPLACE_ME
---
# The Keycloak admin credentials the provisioning Jobs use.
#
# NOT COMMITTED AS-IS: these files are templates. Generate them with
# scripts/make_service_account_secrets.sh, which copies each cluster's own
# Keycloak admin Secret into this namespace so the Jobs can mount it without
# cross-namespace RBAC.
#
# Al Ain source: oicm-keycloak/oicm-keycloak-keycloak-admin-credentials
#   keys admin-username, admin-password
# Abu Dhabi source: keycloak/keycloak-secret
#   key admin-password, user admin
---
apiVersion: v1
kind: Secret
metadata:
  name: oicm-keycloak-admin
  namespace: adeo-litellm
type: Opaque
stringData:
  admin-username: REPLACE_ME
  admin-password: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: ad-oicm-keycloak-admin
  namespace: adeo-litellm
type: Opaque
stringData:
  admin-username: admin
  admin-password: REPLACE_ME
