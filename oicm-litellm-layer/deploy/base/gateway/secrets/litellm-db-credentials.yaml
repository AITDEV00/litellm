---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-db-credentials
  namespace: adeo-litellm
type: Opaque
stringData:
  DATABASE_URL: "postgresql://litellm:litellm_proxy_2025@adeo-litellm-postgres-rw.adeo-litellm:5432/litellm"
# The litellm-logo ConfigMap is created separately with binary files.
# To create or update the logo, run:
  # kubectl create configmap litellm-logo -n adeo-litellm \
  #   --from-file=adeo-ai-gateway.jpg=./decor/adeo-ai-gateway.jpg \
  #   --from-file=favicon.png=./decor/favicon.png
# To update an existing one, delete and recreate, or use:
  # kubectl delete configmap litellm-logo -n adeo-litellm && \
  # kubectl create configmap litellm-logo -n adeo-litellm \
  #   --from-file=adeo-ai-gateway.jpg=./decor/adeo-ai-gateway.jpg \
  #   --from-file=favicon.png=./decor/favicon.png
