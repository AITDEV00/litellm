---
# The broker's own credentials. It is declared here rather than created by hand
# so a fresh namespace, or a re-apply over a drifted one, always has the Secret
# the broker and its source-link sidecar read.
#
# pepper keys the broker's stored source identities.
# service-token authenticates the in-pod control hop between the broker and the
# sidecar, which enforces a 32-character minimum, so this must stay long. It is
# deliberately not the master key: a short inter-service token that doubles as
# an admin key is worse on both counts.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-mcp-source-broker
  namespace: adeo-litellm
type: Opaque
stringData:
  pepper: aNVBwmoXb3XrrT5lbigq-Yw68A20arKkmASr2NNMb0sgBO1DQwlhpdjojrYfYKTX
  service-token: 6qKhYPmmyXvczh4gKQg1wFPKxX0wiSStZu-VK9M_OWlSn68vtqsFySEbZfpDJUlo
