---
# At-rest credential encryption key. MUST stay at the ORIGINAL value that the
# shared DB credentials were encrypted with (sk-1234). If this ever changes, all
# stored credentials become undecryptable and BOTH prod and dev break (they share
# the DB). Do NOT rotate this unless you run the full re-encryption migration.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-salt-key
  namespace: adeo-litellm
type: Opaque
stringData:
  salt-key: sk-1234
