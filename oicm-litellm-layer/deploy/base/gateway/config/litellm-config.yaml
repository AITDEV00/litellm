---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: adeo-litellm
data:
  config.yaml: |
    model_list: []
    litellm_settings:
      store_model_in_db: true
      cache: true
      cache_params:
        type: redis
        ttl: 3600
        default_in_memory_ttl: 60
        max_connections: 500
        socket_timeout: 10.0
      enable_redis_auth_cache: true
      callbacks:
        - litellm_hooks.vllm_param_injector.vllm_param_injector
        - dynamic_rate_limiter_v3_htb
        - litellm_hooks.priority_bridge.priority_bridge
        - prometheus
        # Infers/stamps metadata.session_id for no-client-id traffic so
        # session_affinity can pin a conversation to one replica (prefix KV reuse).
        # The loader needs an instance, not a class: proxy_handler_instance is a
        # module-level singleton whose cache binds per-request. Enabled via
        # SESSION_IDENTITY_ENABLED=true on the Deployment env.
        - litellm.router_utils.session_identity.resolver.proxy_handler_instance
      # Require auth on the /metrics scrape endpoint. Prometheus keeps scraping
      # because the ServiceMonitor (litellm-servicemonitor.yaml) presents the
      # master key as a bearer token.
      require_auth_for_metrics_endpoint: true
      priority_reservation:
        prior1: 0.50
        prior2: 0.30
        prior3: 0.20
      priority_reservation_settings:
        saturation_threshold: 1.0
      priority_body_fields:
        prior1:
          priority: 0
        prior2:
          priority: 100
        prior3:
          priority: 200
      # EXEMPT METHOD: prior1 is fully exempt from priority enforcement (cap = 100% model RPM).
      # prior2 and prior3 fall into a shared default_pool at default_priority.
      # Use key-level rpm_limit on individual API keys to separate prior2/prior3.
      # priority_reservation:
      #   prior1: 1.0
      # priority_reservation_settings:
      #   saturation_threshold: 0.75
      #   default_priority: 0.50
    router_settings:
      routing_strategy: usage-based-routing-v2
      # Sticky sessions: a conversation keeps landing on the replica that served
      # its earlier turns so vLLM prefix KV cache is reused instead of
      # re-prefilled on a second replica. Only pins callers that send a stable
      # session id (x-litellm-session-id header or metadata.session_id);
      # everyone else routes normally. Idle TTL, refreshed on every request.
      optional_pre_call_checks:
        - enforce_model_rate_limits
        - session_affinity
      deployment_affinity_ttl_seconds: 86400
      # ---- Retry budget per exception class (preemptive, post-OOM hardening).
      # AuthenticationError / BadRequest / ContentPolicyViolation almost never
      # self-heal, so don't waste a retry; transient network/5xx do.
      retry_policy:
        InternalServerErrorRetries: 3
        ServiceUnavailableErrorRetries: 3
        TimeoutErrorRetries: 2
        RateLimitErrorRetries: 2
        AuthenticationErrorRetries: 0
        BadRequestErrorRetries: 0
        ContentPolicyViolationErrorRetries: 0
      # Floor for the exponential backoff in _calculate_retry_after; the actual
      # sleep is max(this, INITIAL_RETRY_DELAY * 2**n) plus jitter.
      retry_after: 0.5
      # Per-request and per-stream-chunk upper bounds so a stalled stream
      # fails loud instead of hanging on the outer HTTP timeout. Non-streaming
      # requests on big reasoning models can legitimately take several minutes.
      # stream_timeout must exceed the LONGEST legitimate silence from sglang
      # (which buffers tokens under load and emits them late), not just the
      # average chunk gap. 300s covers Kimi-K3 deep-thinking batches.
      timeout: 600
      stream_timeout: 300
      # Deployment health hysteresis: trip to cooldown after 3 fails, sleep 30s
      # before retrying that deployment (default is 1 fail / 1s).
      allowed_fails: 3
      cooldown_time: 30
      # Fallbacks intentionally omitted for now; to be configured separately.
    general_settings:
      use_redis_transaction_buffer: true
      # Native PG partitioning: upstream creates daily partitions and drops
      # them at retention. 999d means upstream never drops; the janitor
      # CronJob owns actual retention (pressure-based, 60d floor).
      use_spend_logs_partitioning: true
      maximum_spend_logs_retention_period: "999d"
      maximum_spend_logs_retention_interval: "1h"
      # Decouple gateway availability from Postgres (2026-09-08 incident:
      # flush-retry CPU churn starved the event loop until liveness timed
      # out and pods restarted). With this on: auth falls back to cached
      # identity instead of 503 on cache misses, and the pod starts even
      # when the DB is down. Spend-log queueing stays bounded (64MB,
      # drop-oldest) so RAM cannot grow unboundedly while the DB is down.
      allow_requests_on_db_unavailable: true
