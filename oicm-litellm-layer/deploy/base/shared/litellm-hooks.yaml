data:
  vllm_param_injector.py: |
    import os
    from typing import Any, Dict, Optional
    from litellm.integrations.custom_logger import CustomLogger
    from litellm.utils import get_secret


    class VllmParamInjector(CustomLogger):
        """Pre-call hook that injects vLLM-specific parameters from the
        upstream model deployment's ConfigMap into the request."""

        @staticmethod
        def _target_matches(model_info: dict, target_model: str) -> bool:
            litellm_params = model_info.get("litellm_params", {})
            return litellm_params.get("model", "") == target_model

        async def async_pre_call_hook(
            self,
            user_api_key_dict: Dict,
            cache: Any,
            data: Dict,
            call_type: str,
        ) -> Optional[Dict]:
            from litellm.proxy.proxy_server import llm_router

            if llm_router is None or not hasattr(llm_router, "get_model_list"):
                return data

            target_model = data.get("model")
            if not target_model:
                return data

            for model_info in llm_router.get_model_list():
                if self._target_matches(model_info, target_model):
                    model_info_extra = model_info.get("model_info", {})
                    extra_body = {}
                    for key, value in model_info_extra.items():
                        if key.startswith("vllm_") and value is not None:
                            param_name = key[len("vllm_"):]
                            extra_body[param_name] = value
                    if extra_body:
                        existing = data.get("extra_body") or {}
                        existing.update(extra_body)
                        data["extra_body"] = existing
                    break

            return data


    vllm_param_injector = VllmParamInjector()
  priority_bridge.py: |
    import logging
    from typing import Optional, Union

    import litellm
    from litellm.integrations.custom_logger import CustomLogger
    from litellm.caching import DualCache
    from litellm.proxy._types import UserAPIKeyAuth
    from litellm.proxy.hooks.dynamic_rate_limiter_v3_htb import htb_priority
    from litellm.types.utils import CallTypesLiteral

    logger = logging.getLogger("oicm-priority-bridge")

    _CHAT_CALL_TYPES: frozenset[str] = frozenset({"completion", "acompletion"})


    class PriorityBridge(CustomLogger):

        async def async_pre_call_hook(
            self,
            user_api_key_dict: UserAPIKeyAuth,
            cache: DualCache,
            data: dict,
            call_type: CallTypesLiteral,
        ) -> Optional[Union[Exception, str, dict]]:
            body_fields_map = litellm.priority_body_fields
            if not body_fields_map:
                return None

            if call_type not in _CHAT_CALL_TYPES:
                return None

            htb_prio = htb_priority.get()
            if htb_prio is None:
                return None

            body_fields = body_fields_map.get(htb_prio)
            if not body_fields:
                return None

            extra_body = data.get("extra_body") or {}
            extra_body.update(body_fields)
            data["extra_body"] = extra_body

            logger.debug(
                "Injected priority body fields for htb_priority=%s: %s",
                htb_prio,
                list(body_fields.keys()),
            )

            return data


    priority_bridge = PriorityBridge()

  keda_metrics.py: |
    """
    KEDA Metrics Callback — emits ml_model_concurrent_requests Prometheus gauge.

    This is Component #4 of the OICM→LiteLLM integration layer.
    It plugs into LiteLLM via `litellm_settings.callbacks` in config.yaml.

    How it works:
    1. On each incoming request (log_pre_api_call): increment gauge
    2. On each completed request (async_log_success_event): decrement gauge
    3. On each failed request (async_log_failure_event): decrement gauge
    4. The gauge is exposed on LiteLLM's /metrics endpoint alongside other Prometheus metrics

    KEDA integration:
      The existing KEDA ScaledObject for 0f8674c2 (MinerU) uses:
        sum(ml_model_concurrent_requests{model_id="<uuid>"})

      This callback emits the exact same metric name and label, so the existing
      KEDA ScaledObject continues to work without modification.

    Model ID resolution:
      LiteLLM uses model_name (e.g., "Qwen/Qwen3-Next-80B-A3B-Instruct") internally,
      but KEDA uses the OICM UUID (e.g., "0f8674c2-5fb8-43c7-bf2d-a6e5db2c0ff4").
      We resolve model_name → oicm_uuid from the model_info metadata stored by
      the discovery controller.
    """

    import logging
    from typing import Optional

    from litellm.integrations.custom_logger import CustomLogger

    logger = logging.getLogger("oicm-keda")

    # ─── Prometheus gauge ───────────────────────────────────────────────────────

    try:
        from prometheus_client import Gauge

        CONCURRENT_REQUESTS = Gauge(
            "ml_model_concurrent_requests",
            "Number of concurrent requests currently being processed",
            ["model_id"],
        )
        PROMETHEUS_AVAILABLE = True
    except ImportError:
        logger.warning("prometheus_client not installed, KEDA metrics disabled")
        PROMETHEUS_AVAILABLE = False


    # ─── Model name → OICM UUID resolution ─────────────────────────────────────

    # Cache: model_name → oicm_uuid
    # Populated from model_info metadata (set by discovery controller)
    _uuid_cache: dict = {}


    def _resolve_uuid(model_name: str, kwargs: dict) -> Optional[str]:
        """
        Resolve a LiteLLM model_name to an OICM UUID.

        Strategy:
        1. Check the kwargs metadata (litellm_params.model_info.oicm_uuid)
        2. Check the in-memory cache
        3. Return None if not found (gauge won't be emitted)
        """
        # Try from kwargs metadata. At pre-call time (log_pre_api_call) the
        # routing metadata lives under litellm_params.metadata; post-call events
        # also surface it at the top level. Check both shapes.
        litellm_params = kwargs.get("litellm_params", {}) or {}
        metadata = kwargs.get("metadata") or litellm_params.get("metadata") or {}
        model_info = metadata.get("model_info", {}) or {}
        oicm_uuid = model_info.get("oicm_uuid")
        if oicm_uuid:
            _uuid_cache[model_name] = oicm_uuid
            return oicm_uuid

        # Try cache
        if model_name in _uuid_cache:
            return _uuid_cache[model_name]

        return None


    def _get_model_id(kwargs: dict) -> Optional[str]:
        """Get the model identifier for KEDA labeling."""
        # The model field in kwargs could be the litellm model name or the model_name
        model = kwargs.get("model", "")

        # Strip the "hosted_vllm/" prefix if present
        if model.startswith("hosted_vllm/"):
            model = model[len("hosted_vllm/"):]

        # Try to resolve to OICM UUID
        uuid = _resolve_uuid(model, kwargs)
        if uuid:
            return uuid

        # Fallback: use the model name as-is
        return model


    # ─── Callback ───────────────────────────────────────────────────────────────

    class KEDAMetricsCallback(CustomLogger):
        """
        Custom callback that emits ml_model_concurrent_requests for KEDA.

        Register in config.yaml:

            litellm_settings:
              callbacks:
                - hooks.keda_metrics.KEDAMetricsCallback
        """

        def log_pre_api_call(self, model, messages, kwargs):
            """Increment concurrent requests gauge before the API call.

            Upstream invokes the synchronous pre-call hook, not the async one, so
            this must stay sync or the gauge is never incremented and only ever
            decrements.
            """
            if not PROMETHEUS_AVAILABLE:
                return

            model_id = _get_model_id(kwargs)
            if model_id:
                try:
                    CONCURRENT_REQUESTS.labels(model_id=model_id).inc()
                    logger.debug(f"KEDA inc: model_id={model_id}")
                except Exception as e:
                    logger.error(f"KEDA inc error for {model_id}: {e}")

        async def async_log_success_event(self, kwargs, response_obj, start_time, end_time):
            """Decrement concurrent requests gauge on success."""
            if not PROMETHEUS_AVAILABLE:
                return

            model_id = _get_model_id(kwargs)
            if model_id:
                try:
                    CONCURRENT_REQUESTS.labels(model_id=model_id).dec()
                    logger.debug(f"KEDA dec (success): model_id={model_id}")
                except Exception as e:
                    logger.error(f"KEDA dec error for {model_id}: {e}")

        async def async_log_failure_event(self, kwargs, response_obj, start_time, end_time):
            """Decrement concurrent requests gauge on failure."""
            if not PROMETHEUS_AVAILABLE:
                return

            model_id = _get_model_id(kwargs)
            if model_id:
                try:
                    CONCURRENT_REQUESTS.labels(model_id=model_id).dec()
                    logger.debug(f"KEDA dec (failure): model_id={model_id}")
                except Exception as e:
                    logger.error(f"KEDA dec error for {model_id}: {e}")

        async def async_log_stream_event(self, kwargs, response_obj, start_time, end_time):
            """No-op for streaming events, which are tracked at request level."""
            pass


    # The config loader resolves dotted callback paths to attributes, so it needs
    # a module-level instance, not the bare class (same convention as
    # priority_bridge).
    keda_metrics = KEDAMetricsCallback()
