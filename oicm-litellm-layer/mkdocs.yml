# Injects the master key into docs via the {{ master_key }} placeholder, read
# from the single source of truth: the `litellm-master-key` Secret in
# deploy/base/gateway/secrets/litellm-master-key.yaml. See scripts/mkdocs_master_key.py.
hooks:
  - scripts/mkdocs_master_key.py

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

